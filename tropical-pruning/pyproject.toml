[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tropical-pruning"
version = "0.1.0"
description = "Winner-based Tropical Structured Pruning for Neural Networks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9,<3.13"
authors = [
    { name = "Xiwei Pan" }
]
keywords = [
    "tropical-algebra",
    "neural-network-pruning",
    "model-compression",
    "deep-learning",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "numpy>=1.20",
    "torch>=2.0",
    "torchvision>=0.15",
    "tqdm>=4.60",
    "tropical-gemm[torch]",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "maturin>=1.0",
]
experiment = [
    "wandb>=0.15",
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "pandas>=1.5",
    "scikit-learn>=1.2",
]
all = [
    "tropical-pruning[dev,experiment]",
]

[project.urls]
Homepage = "https://github.com/isPANN/tropical-ml"
Documentation = "https://github.com/isPANN/tropical-ml#readme"
Repository = "https://github.com/isPANN/tropical-ml"

[tool.hatch.build.targets.wheel]
packages = ["tropical_pruning"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.black]
line-length = 88
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 88
target-version = "py39"
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
